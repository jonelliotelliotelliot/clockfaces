<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clockface</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #FAF9F6;
  }
  canvas {
    display: block;
  }

  #configPanel {
    position: fixed;
    left: 16px;
    bottom: 16px;
    z-index: 1000;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 13px;
    color: #111827;
    -webkit-user-select: none;
    user-select: none;
  }
  #configToggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #FFFFFF;
    border: 1px solid rgba(17, 24, 39, 0.08);
    border-radius: 999px;
    padding: 9px 16px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(17, 24, 39, 0.08), 0 2px 6px rgba(17, 24, 39, 0.04);
    font: inherit;
    font-weight: 500;
    color: #111827;
    transition: background 0.15s ease;
  }
  #configToggle:hover {
    background: #F9FAFB;
  }
  #configToggle .cfg-icon {
    display: inline-flex;
    color: #6B7280;
  }
  #configToggle .chev {
    display: inline-flex;
    color: #9CA3AF;
    transition: transform 0.15s ease;
  }
  #configPanel.open #configToggle .chev {
    transform: rotate(180deg);
  }
  #configBody {
    display: none;
    margin-top: 10px;
    width: 300px;
    max-height: 70vh;
    overflow-y: auto;
    background: #FFFFFF;
    border: 1px solid rgba(17, 24, 39, 0.08);
    border-radius: 16px;
    padding: 16px 18px;
    box-shadow: 0 20px 50px rgba(17, 24, 39, 0.12), 0 4px 12px rgba(17, 24, 39, 0.06);
  }
  #configPanel.open #configBody {
    display: block;
  }
  .cfg-section {
    padding-top: 14px;
    margin-top: 14px;
    border-top: 1px solid rgba(17, 24, 39, 0.06);
  }
  .cfg-section:first-child {
    padding-top: 0;
    margin-top: 0;
    border-top: none;
  }
  .cfg-section h4 {
    margin: 0 0 8px;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #9CA3AF;
    font-weight: 600;
  }
  .cfg-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 5px 6px;
    margin: 0 -6px;
    border-radius: 8px;
    transition: background 0.1s ease;
  }
  .cfg-row:hover {
    background: rgba(17, 24, 39, 0.035);
  }
  .cfg-row label {
    flex: 1;
    color: #374151;
    font-size: 12.5px;
  }
  .cfg-row input[type="range"] {
    flex: 1.3;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 999px;
    background: #E5E7EB;
    outline: none;
  }
  .cfg-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #111827;
    cursor: pointer;
    box-shadow: 0 1px 3px rgba(17, 24, 39, 0.35);
  }
  .cfg-row input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border: none;
    border-radius: 50%;
    background: #111827;
    cursor: pointer;
    box-shadow: 0 1px 3px rgba(17, 24, 39, 0.35);
  }
  .cfg-row input[type="range"]::-moz-range-track {
    height: 4px;
    border-radius: 999px;
    background: #E5E7EB;
  }
  .cfg-row select {
    flex: 1.3;
    font: inherit;
    font-size: 12.5px;
    color: #111827;
    -webkit-appearance: none;
    appearance: none;
    background: #F3F4F6;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 5px 10px;
    cursor: pointer;
  }
  .cfg-row .cfg-val {
    min-width: 32px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: #9CA3AF;
    font-size: 11.5px;
  }
  .cfg-row input[type="color"] {
    width: 26px;
    height: 26px;
    padding: 0;
    border: 1px solid rgba(17, 24, 39, 0.1);
    border-radius: 8px;
    background: none;
    cursor: pointer;
    flex: none;
  }
  .cfg-row input[type="color"]::-webkit-color-swatch-wrapper {
    padding: 2px;
  }
  .cfg-row input[type="color"]::-webkit-color-swatch {
    border: none;
    border-radius: 6px;
  }
  .cfg-row input[type="checkbox"] {
    -webkit-appearance: none;
    appearance: none;
    position: relative;
    width: 34px;
    height: 20px;
    border-radius: 999px;
    background: #E5E7EB;
    cursor: pointer;
    flex: none;
    outline: none;
    transition: background 0.15s ease;
  }
  .cfg-row input[type="checkbox"]::before {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #FFFFFF;
    box-shadow: 0 1px 2px rgba(17, 24, 39, 0.3);
    transition: transform 0.15s ease;
  }
  .cfg-row input[type="checkbox"]:checked {
    background: #111827;
  }
  .cfg-row input[type="checkbox"]:checked::before {
    transform: translateX(14px);
  }
  #configReset {
    margin-top: 16px;
    width: 100%;
    padding: 9px;
    border-radius: 10px;
    border: 1px solid rgba(17, 24, 39, 0.08);
    background: #F9FAFB;
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    color: #374151;
    transition: background 0.15s ease;
  }
  #configReset:hover {
    background: #F3F4F6;
  }
</style>
</head>
<body>
<canvas id="clock"></canvas>

<div id="configPanel">
  <button id="configToggle" type="button">
    <span class="cfg-icon">
      <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <line x1="3" y1="5" x2="17" y2="5"/><circle cx="12" cy="5" r="2" fill="currentColor" stroke="none"/>
        <line x1="3" y1="10" x2="17" y2="10"/><circle cx="7" cy="10" r="2" fill="currentColor" stroke="none"/>
        <line x1="3" y1="15" x2="17" y2="15"/><circle cx="14" cy="15" r="2" fill="currentColor" stroke="none"/>
      </svg>
    </span>
    Settings
    <span class="chev">
      <svg width="10" height="10" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 8 10 13 15 8"/></svg>
    </span>
  </button>
  <div id="configBody">
    <div id="configControls"></div>
    <button id="configReset" type="button">Reset to defaults</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<script>
(function () {
  "use strict";

  // ============================================================
  // CONFIG — tweak these to change the clockface's look & feel.
  // ============================================================
  const CONFIG = {
    // ---- colour palette ----
    // A restrained, tasteful scheme: one soft "ink" neutral for everything
    // on the dial, a warm paper-white background, and a single accent color
    // reserved for the second hand — the one pop of color, not a rainbow.
    backgroundColor: "#3341ff",   // clock face background, inside the circle
    pageBackgroundColor: "#ffffff", // page background, behind/around the clock face
    inkColor: "#ffffff",          // shared neutral: ticks, numerals, hub, border
    circleColor: "#ffc31f",       // the seconds "particles" — matches the ink for a restrained look
    borderEnabled: false,          // the outer ring outline around the clock face
    borderColor: "#1C1C1E",

    // ---- physics ----
    gravity: 0.4,              // downward pull on circles (0 = weightless, 1 = normal)
    restitution: 0.6,        // bounciness of circles (0 = no bounce, 1 = perfectly bouncy)
    friction: 0.15,          // surface friction between circles/walls
    frictionAir: 0.001,      // air drag, slows everything down over time
    density: 0.001,          // mass per area — affects how circles push each other around

    // ---- spawn behaviour ----
    spawnLocation: "random", // "random" = born at a random point on the face, "center" = born at the pivot
    burstSpeedMin: 2,        // slowest possible launch speed on spawn
    burstSpeedMax: 8,       // fastest possible launch speed on spawn
    spinMax: 0.2,            // max random spin (angular velocity) applied on spawn

    // ---- circle sizing ----
    circlesPerCycle: 60,        // one circle per second, reset every this-many
    minRadiusFactor: 0.045,     // smallest circle radius, relative to clockface RADIUS
    maxRadiusFactor: 0.30,      // largest circle radius, relative to clockface RADIUS
    sizeVariation: 1.6,         // >1 = more spread between small/large circles, 1 = uniform
    fillFactor: 0.7,           // target fraction of the face's area filled after 60 circles
                                 // (progress-bar effect: face fills steadily over the minute)

    // ---- liquid merge (gooey metaball look for the circles) ----
    // Classic "goo" trick: render all circles to an offscreen buffer, then
    // composite that buffer through blur+contrast. The blur is what lets
    // nearby circles visually bridge into one shape; the high contrast pass
    // snaps the blurred edge back to a crisp boundary.
    liquidMergeEnabled: true,
    liquidMergeBlurFactor: 0.025,  // blur radius, relative to clockface RADIUS
    liquidMergeContrast: 30,      // higher = snappier/harder edge on the merge

    // ---- particle birth / death animation ----
    birthAnimationEnabled: true,  // newly spawned circles grow in with a little pop
    birthDurationMs: 220,
    deathAnimationEnabled: true,  // circles shrink out (still fully physical) when a cycle resets, instead of vanishing
    deathDurationMs: 260,         // how long each circle takes to shrink away once its stagger delay elapses
    deathStaggerMs: 550,          // circles start dying at random times within this window, not all at once

    // ---- clockface layout ----
    clockRadiusFactor: 0.92,      // visible clockface radius, relative to half the shorter viewport side
    physicsOvershootFactor: 1.06, // physics containment radius vs visible radius (lets circles
                                   // settle slightly past the rim, cropped clean by the clip mask)
    borderWidthFactor: 0.012,     // clockface border stroke width, relative to RADIUS
    borderWidthMin: 2,            // minimum border stroke width in px

    // ---- analog face (numerals, ticks, hour/minute hands) ----
    numeralsEnabled: false,              // set false to hide the 1–12 numerals
    numeralFontSizeFactor: 0.13,        // hour numeral size, relative to RADIUS
    numeralRadiusFactor: 0.80,          // distance from centre to each numeral, relative to RADIUS
    tickOuterRadiusFactor: 0.97,        // ticks start just inside the border
    hourTickLengthFactor: 0.05,         // how far the 12 hour ticks reach inward, relative to RADIUS
    minuteTickLengthFactor: 0.02,       // how far the other 48 minute ticks reach inward, relative to RADIUS
    hourTickWidthFactor: 0.006,         // hour tick stroke width, relative to RADIUS
    minuteTickWidthFactor: 0.006,       // minute tick stroke width, relative to RADIUS
    hourHandLengthFactor: 0.72,          // relative to RADIUS
    hourHandThicknessFactor: 0.03,
    hourHandColor: "#ffffff",
    minuteHandLengthFactor: 0.82,
    minuteHandThicknessFactor: 0.03,
    minuteHandColor: "#1C1C1E",
    hubRadiusFactor: 0.028,             // centre pivot cap drawn on top of everything
    hubColor: "#1C1C1E",

    // ---- centre circle (decorative accent behind the pivot hub) ----
    centerCircleEnabled: true,
    centerCircleRadiusFactor: 0.04,     // relative to RADIUS
    centerCircleColor: "#000000",

    // ---- boundary wall construction (rarely needs tweaking) ----
    wallSegments: 90,          // number of straight segments approximating the circular wall
    wallThickness: 50,         // thickness of each wall segment
    wallChordOverlap: 1.15,    // segment length multiplier so adjacent segments overlap slightly

    // ---- second hand ----
    secondHandEnabled: true,        // sweeping arm that physically shoves circles around
    secondHandLengthFactor: 0.9,    // tip length from the pivot, relative to clockface RADIUS
    secondHandTailFactor: 0.14,     // short counterweight tail behind the pivot, relative to length
    secondHandThicknessFactor: 0.02,// thickness, relative to RADIUS
    secondHandColor: "#ff4747",     // colour of the second hand — the single accent color
    secondHandSweep: "tick",        // "smooth" = continuous sweep (best for pushing balls),
                                     // "tick" = jumps once per second like a quartz clock
    debugCenterDot: false,          // draws a red dot at the exact geometric centre, for alignment checks

    fontFamily: "'Helvetica Neue', Arial, sans-serif",
    fontWeight: "700",
  };

  // ---------- setup ----------
  const { Engine, World, Bodies, Body, Composite } = Matter;

  const canvas = document.getElementById("clock");
  const ctx = canvas.getContext("2d");

  // offscreen buffers for the "liquid merge" pass. metaballCanvas holds a
  // pure black/white mask (circles = white, on black) — the blur has to see
  // every circle together for neighbours to bridge into one blob, which a
  // per-circle filter can't do. liquidCanvas holds that mask after
  // blur+contrast, recoloured into the actual circle colour (see
  // drawLiquidCircles for why it's done in two stages).
  const metaballCanvas = document.createElement("canvas");
  const metaballCtx = metaballCanvas.getContext("2d");
  const liquidCanvas = document.createElement("canvas");
  const liquidCtx = liquidCanvas.getContext("2d");

  let W = window.innerWidth;
  let H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;

  // center + radius of the visible clockface circle
  let CX = W / 2, CY = H / 2, RADIUS = 0;
  // physics containment is slightly larger than the visible circle so balls
  // can settle a bit past the rim and get cleanly cropped by the clip mask,
  // instead of leaving diamond-shaped gaps between ball and edge.
  let PHYSICS_RADIUS = 0;

  const engine = Engine.create();
  const world = engine.world;
  world.gravity.y = CONFIG.gravity;

  // ---------- walls ----------
  // Approximate a circular boundary with a ring of static rectangular segments
  // (like the staves of a bowl) so physics bodies are contained within a circle.
  let walls = [];
  function buildWalls() {
    Composite.remove(world, walls);
    walls = [];
    const segments = CONFIG.wallSegments;
    const thickness = CONFIG.wallThickness;
    for (let i = 0; i < segments; i++) {
      const angle = (i / segments) * Math.PI * 2;
      const chord = (2 * Math.PI * PHYSICS_RADIUS) / segments;
      const segX = CX + Math.cos(angle) * (PHYSICS_RADIUS + thickness / 2);
      const segY = CY + Math.sin(angle) * (PHYSICS_RADIUS + thickness / 2);
      const seg = Bodies.rectangle(segX, segY, chord * CONFIG.wallChordOverlap, thickness, {
        isStatic: true,
        angle: angle + Math.PI / 2,
      });
      walls.push(seg);
    }
    Composite.add(world, walls);
  }

  // ---------- second hand ----------
  // A kinematic arm (static body we reposition by hand every frame) that
  // sweeps around the pivot in real time. Because it's static it never
  // reacts to being hit, but it does shove any dynamic circle it sweeps
  // into — Matter resolves that as a hard, one-sided push.
  let secondHandBody = null;
  let handLength = 0, handTail = 0, handThickness = 0;

  function buildSecondHand() {
    if (secondHandBody) Composite.remove(world, secondHandBody);
    if (!CONFIG.secondHandEnabled) { secondHandBody = null; return; }

    handLength = RADIUS * CONFIG.secondHandLengthFactor;
    handTail = handLength * CONFIG.secondHandTailFactor;
    handThickness = RADIUS * CONFIG.secondHandThicknessFactor;

    secondHandBody = Bodies.rectangle(CX, CY, handLength + handTail, handThickness, {
      isStatic: true,
      friction: 0,
    });
    Composite.add(world, secondHandBody);
  }

  function secondHandAngle() {
    const now = new Date();
    let secs = now.getSeconds();
    if (CONFIG.secondHandSweep === "smooth") secs += now.getMilliseconds() / 1000;
    const frac = secs / 60;
    return -Math.PI / 2 + frac * Math.PI * 2; // 0s points straight up, sweeps clockwise
  }

  function updateSecondHand() {
    if (!secondHandBody) return;
    const angle = secondHandAngle();
    // the pivot sits (handTail) in from the rectangle's near end, so the
    // body's centroid is offset from the pivot along the hand's direction
    const centroidOffset = (handLength - handTail) / 2;
    Body.setPosition(secondHandBody, {
      x: CX + Math.cos(angle) * centroidOffset,
      y: CY + Math.sin(angle) * centroidOffset,
    });
    Body.setAngle(secondHandBody, angle);
  }

  // ---------- analog face ----------
  // Ticks, hour numerals, and the hour/minute hands are purely visual (no
  // physics body) — only the second hand actually pushes circles around.

  function drawHand(angle, length, thickness, color) {
    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.roundRect(0, -thickness / 2, length, thickness, thickness / 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
  }

  function drawAnalogFace() {
    const now = new Date();
    const hours = now.getHours() % 12;
    const minutes = now.getMinutes();
    const seconds = now.getSeconds();

    // 60 tick marks — every 5th (the hour marks) drawn longer & thicker
    ctx.fillStyle = CONFIG.inkColor;
    for (let i = 0; i < 60; i++) {
      const angle = (i / 60) * Math.PI * 2 - Math.PI / 2;
      const isHour = i % 5 === 0;
      const outer = RADIUS * CONFIG.tickOuterRadiusFactor;
      const inner = outer - RADIUS * (isHour ? CONFIG.hourTickLengthFactor : CONFIG.minuteTickLengthFactor);
      const width = RADIUS * (isHour ? CONFIG.hourTickWidthFactor : CONFIG.minuteTickWidthFactor);
      ctx.save();
      ctx.translate(CX, CY);
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.roundRect(inner, -width / 2, outer - inner, width, width / 2);
      ctx.fill();
      ctx.restore();
    }

    // numerals 1–12
    if (CONFIG.numeralsEnabled) {
      ctx.fillStyle = CONFIG.inkColor;
      ctx.font = `${CONFIG.fontWeight} ${RADIUS * CONFIG.numeralFontSizeFactor}px ${CONFIG.fontFamily}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const numeralRadius = RADIUS * CONFIG.numeralRadiusFactor;
      for (let n = 1; n <= 12; n++) {
        const angle = (n / 12) * Math.PI * 2 - Math.PI / 2;
        ctx.fillText(String(n), CX + Math.cos(angle) * numeralRadius, CY + Math.sin(angle) * numeralRadius);
      }
    }

    // hour hand
    const hourAngle = ((hours + minutes / 60) / 12) * Math.PI * 2 - Math.PI / 2;
    drawHand(hourAngle, RADIUS * CONFIG.hourHandLengthFactor, RADIUS * CONFIG.hourHandThicknessFactor, CONFIG.hourHandColor);

    // minute hand
    const minuteAngle = ((minutes + seconds / 60) / 60) * Math.PI * 2 - Math.PI / 2;
    drawHand(minuteAngle, RADIUS * CONFIG.minuteHandLengthFactor, RADIUS * CONFIG.minuteHandThicknessFactor, CONFIG.minuteHandColor);
  }

  // ---------- seconds circles ----------

  // simple easing curves for the birth/death "juice"
  function easeOutBack(t) {
    t = Math.min(Math.max(t, 0), 1);
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }
  function easeInQuad(t) {
    t = Math.min(Math.max(t, 0), 1);
    return t * t;
  }

  let circleBodies = [];
  let lastSecond = -1;
  let sizeSchedule = [];
  let spawnIndex = 0;
  let started = false;

  // Marks every current circle to shrink away over the next little while,
  // at a random staggered start time each, rather than removing them
  // instantly. They stay fully in the physics world the whole time — still
  // falling, still colliding, still get shoved by the second hand — so
  // they keep behaving physically as they shrink. It's fine (and looks
  // good) if some are still shrinking as the new cycle's circles spawn in.
  function resetCircles() {
    if (CONFIG.deathAnimationEnabled) {
      const now = performance.now();
      for (const body of circleBodies) {
        body.dyingAt = now + Math.random() * CONFIG.deathStaggerMs;
        body.deathScale = 1;
      }
    } else {
      Composite.remove(world, circleBodies);
      circleBodies = [];
    }
    spawnIndex = 0;
    buildSizeSchedule();
  }

  // Physically shrinks every circle marked for death, and removes each one
  // from the world once it's fully shrunk away. Called once per tick.
  function updateDyingCircles(now) {
    for (let i = circleBodies.length - 1; i >= 0; i--) {
      const body = circleBodies[i];
      if (body.dyingAt === undefined || now < body.dyingAt) continue;

      const t = (now - body.dyingAt) / CONFIG.deathDurationMs;
      if (t >= 1) {
        Composite.remove(world, body);
        circleBodies.splice(i, 1);
        continue;
      }

      const targetScale = 1 - easeInQuad(t);
      const factor = targetScale / body.deathScale;
      Body.scale(body, factor, factor);
      body.deathScale = targetScale;
    }
  }

  // Precompute the radius of every circle in the upcoming cycle so their
  // total area sums to a target fraction of the clockface's area — this is
  // what makes the face fill up steadily like a progress bar over 60
  // circles, rather than filling unpredictably fast or slow.
  function buildSizeSchedule() {
    const n = CONFIG.circlesPerCycle;
    const targetArea = Math.PI * RADIUS * RADIUS * CONFIG.fillFactor;
    const minR = RADIUS * CONFIG.minRadiusFactor;
    const maxR = RADIUS * CONFIG.maxRadiusFactor;

    const weights = [];
    for (let i = 0; i < n; i++) weights.push(Math.pow(Math.random(), CONFIG.sizeVariation));
    const meanW = weights.reduce((a, b) => a + b, 0) / n;

    const radii = weights.map(w => {
      const area = (w / meanW) * (targetArea / n);
      const r = Math.sqrt(area / Math.PI);
      return Math.min(Math.max(r, minR), maxR);
    });

    // shuffle so sizes appear in random order across the minute, not sorted
    for (let i = radii.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [radii[i], radii[j]] = [radii[j], radii[i]];
    }

    sizeSchedule = radii;
  }

  // Picks a uniformly-random point inside the clockface (via sqrt for even
  // area coverage), kept clear of the wall so the new circle doesn't spawn
  // already overlapping it.
  function randomSpawnPoint(r) {
    const spawnRadius = Math.sqrt(Math.random()) * Math.max(RADIUS - r - 4, 0);
    const angle = Math.random() * Math.PI * 2;
    return {
      x: CX + Math.cos(angle) * spawnRadius,
      y: CY + Math.sin(angle) * spawnRadius,
    };
  }

  function spawnCircle() {
    const r = sizeSchedule[spawnIndex] || RADIUS * CONFIG.minRadiusFactor;
    spawnIndex++;

    const { x, y } = CONFIG.spawnLocation === "center"
      ? { x: CX, y: CY }
      : randomSpawnPoint(r);

    const body = Bodies.circle(x, y, r, {
      restitution: CONFIG.restitution,
      friction: CONFIG.friction,
      frictionAir: CONFIG.frictionAir,
      density: CONFIG.density,
    });

    const angle = Math.random() * Math.PI * 2;
    const speed = CONFIG.burstSpeedMin + Math.random() * (CONFIG.burstSpeedMax - CONFIG.burstSpeedMin);
    Body.setVelocity(body, {
      x: Math.cos(angle) * speed,
      y: Math.sin(angle) * speed,
    });
    Body.setAngularVelocity(body, (Math.random() - 0.5) * CONFIG.spinMax);
    body.bornAt = performance.now();
    circleBodies.push(body);
    Composite.add(world, body);
  }

  // Spawn is driven by the real clock second, so 60 circles always line up
  // exactly with a full minute, and the reset lands exactly on minute rollover.
  function updateSecondsIfNeeded() {
    const second = new Date().getSeconds();
    if (second === lastSecond) return;
    lastSecond = second;
    if (second === 0) resetCircles();
    spawnCircle();
  }

  // ---------- render loop ----------

  // radius a given circle should currently draw at, including the birth
  // grow-in animation (death shrink is already baked into circleRadius)
  function drawnRadius(body, now) {
    const age = now - body.bornAt;
    const scale = CONFIG.birthAnimationEnabled && age < CONFIG.birthDurationMs
      ? easeOutBack(age / CONFIG.birthDurationMs)
      : 1;
    return body.circleRadius * Math.max(scale, 0);
  }

  function drawCirclesDirect(now) {
    ctx.fillStyle = CONFIG.circleColor;
    for (const body of circleBodies) {
      const r = drawnRadius(body, now);
      ctx.beginPath();
      ctx.arc(body.position.x, body.position.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function hexToRgb(hex) {
    const v = hex.replace("#", "");
    const full = v.length === 3 ? v.split("").map(c => c + c).join("") : v;
    const n = parseInt(full, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  // The gooey "liquid merge" look, done in two stages to avoid a colour-
  // fringing artifact: blur+contrast applied directly to two differently-
  // hued flat colours can push each RGB channel past its threshold at a
  // different point in the blurred gradient (since e.g. a saturated colour's
  // R, G, B values sit at very different distances from the background's),
  // producing rainbow edges. Pure black/white is immune to this — all three
  // channels are identical, so they always cross together.
  //
  // 1. Render circles as a plain white-on-black mask.
  // 2. Blur + contrast that mask (still black/white, still fringe-free).
  // 3. Use the resulting luminance as an alpha channel, paired with the
  //    actual circle colour — this recolours the goo shape correctly no
  //    matter what colour combination is chosen.
  function drawLiquidCircles(now) {
    metaballCtx.clearRect(0, 0, W, H);
    metaballCtx.fillStyle = "#000000";
    metaballCtx.fillRect(0, 0, W, H);
    metaballCtx.fillStyle = "#ffffff";
    for (const body of circleBodies) {
      const r = drawnRadius(body, now);
      metaballCtx.beginPath();
      metaballCtx.arc(body.position.x, body.position.y, r, 0, Math.PI * 2);
      metaballCtx.fill();
    }

    const blurPx = RADIUS * CONFIG.liquidMergeBlurFactor;

    // Everything from here only needs to touch the clock face's bounding
    // box (padded for blur bleed + the physics overshoot margin) — there's
    // no reason to blur, threshold, or (especially) run the CPU-bound
    // per-pixel recolour loop over the whole browser window when the clock
    // only occupies a fraction of it. That per-pixel loop is by far the
    // most expensive part of this effect, so keeping its area small matters
    // a lot for CPU load / battery and fan noise on the real page.
    const pad = blurPx * 2 + 4;
    const bx = Math.max(0, Math.floor(CX - PHYSICS_RADIUS - pad));
    const by = Math.max(0, Math.floor(CY - PHYSICS_RADIUS - pad));
    const bw = Math.min(W, Math.ceil(CX + PHYSICS_RADIUS + pad)) - bx;
    const bh = Math.min(H, Math.ceil(CY + PHYSICS_RADIUS + pad)) - by;

    liquidCtx.clearRect(bx, by, bw, bh);
    liquidCtx.filter = `blur(${blurPx}px) contrast(${CONFIG.liquidMergeContrast})`;
    liquidCtx.drawImage(metaballCanvas, bx, by, bw, bh, bx, by, bw, bh);
    liquidCtx.filter = "none";

    const img = liquidCtx.getImageData(bx, by, bw, bh);
    const data = img.data;
    const [cr, cg, cb] = hexToRgb(CONFIG.circleColor);
    for (let i = 0; i < data.length; i += 4) {
      const luminance = data[i]; // mask is grayscale: R === G === B
      data[i] = cr;
      data[i + 1] = cg;
      data[i + 2] = cb;
      data[i + 3] = luminance;
    }
    liquidCtx.putImageData(img, bx, by);

    ctx.drawImage(liquidCanvas, bx, by, bw, bh, bx, by, bw, bh);
  }

  function draw(now) {
    ctx.clearRect(0, 0, W, H);

    ctx.save();
    ctx.beginPath();
    ctx.arc(CX, CY, RADIUS, 0, Math.PI * 2);
    ctx.clip();

    ctx.fillStyle = CONFIG.backgroundColor;
    ctx.fillRect(0, 0, W, H);

    // circles — either goo'd together with the liquid-merge pass, or drawn
    // directly if that's disabled. Dying circles need no special-casing
    // either way: their shrink is already baked into body.circleRadius by
    // updateDyingCircles().
    ctx.globalCompositeOperation = "source-over";
    if (CONFIG.liquidMergeEnabled) {
      drawLiquidCircles(now);
    } else {
      drawCirclesDirect(now);
    }

    // second hand — drawn from its live physics body so what you see always
    // matches exactly what's pushing the circles around
    if (secondHandBody) {
      ctx.save();
      ctx.translate(secondHandBody.position.x, secondHandBody.position.y);
      ctx.rotate(secondHandBody.angle);
      ctx.beginPath();
      ctx.roundRect(-(handLength + handTail) / 2, -handThickness / 2, handLength + handTail, handThickness, handThickness / 2);
      ctx.fillStyle = CONFIG.secondHandColor;
      ctx.fill();
      ctx.restore();
    }

    // face (ticks, numerals, hour/minute hands) — drawn opaque, on top of
    // the circles and second hand, same as a real clock's dial furniture
    // sitting above anything on the dial surface.
    drawAnalogFace();

    // centre circle — a decorative accent sitting behind the pivot hub,
    // always solid, never inverted
    if (CONFIG.centerCircleEnabled) {
      ctx.globalCompositeOperation = "source-over";
      ctx.beginPath();
      ctx.arc(CX, CY, RADIUS * CONFIG.centerCircleRadiusFactor, 0, Math.PI * 2);
      ctx.fillStyle = CONFIG.centerCircleColor;
      ctx.fill();
    }

    // centre hub — drawn on top of everything
    ctx.beginPath();
    ctx.arc(CX, CY, RADIUS * CONFIG.hubRadiusFactor, 0, Math.PI * 2);
    ctx.fillStyle = CONFIG.hubColor;
    ctx.fill();

    ctx.restore();

    // clockface border
    if (CONFIG.borderEnabled) {
      ctx.beginPath();
      ctx.arc(CX, CY, RADIUS, 0, Math.PI * 2);
      ctx.lineWidth = Math.max(RADIUS * CONFIG.borderWidthFactor, CONFIG.borderWidthMin);
      ctx.strokeStyle = CONFIG.borderColor;
      ctx.stroke();
    }

    // DEBUG: marks the exact geometric centre (CX, CY) — same point the
    // circle and the second-hand pivot are both computed from.
    if (CONFIG.debugCenterDot) {
      ctx.beginPath();
      ctx.arc(CX, CY, Math.max(RADIUS * 0.012, 3), 0, Math.PI * 2);
      ctx.fillStyle = "red";
      ctx.fill();
    }
  }

  // ---------- main loop ----------

  let lastTime = performance.now();
  function tick(now) {
    const delta = Math.min(now - lastTime, 33);
    lastTime = now;
    updateSecondHand();
    Engine.update(engine, delta);
    updateSecondsIfNeeded();
    updateDyingCircles(now);
    draw(now);
    requestAnimationFrame(tick);
  }

  // On first load, spawn a backlog of circles matching however many seconds
  // have already elapsed this minute (instead of always starting at zero),
  // then fast-forward the physics a bit so they're not just hanging frozen
  // mid-air at their spawn points when the page first paints.
  function preloadElapsedSeconds() {
    const nowSec = new Date().getSeconds();
    for (let i = 0; i < nowSec; i++) spawnCircle();
    lastSecond = nowSec;
    updateSecondHand();
    for (let i = 0; i < 60; i++) Engine.update(engine, 16.67);
  }

  // On resize, reposition + resize existing circles proportionally to the
  // new geometry instead of wiping them out, so the seconds count and fill
  // progress survive a window resize.
  function rescaleCircles(oldCX, oldCY, oldRadius, newCX, newCY, newRadius) {
    if (!oldRadius) return;
    const factor = newRadius / oldRadius;
    for (const body of circleBodies) {
      const relX = (body.position.x - oldCX) * factor;
      const relY = (body.position.y - oldCY) * factor;
      Body.setPosition(body, { x: newCX + relX, y: newCY + relY });
      Body.scale(body, factor, factor);
    }
  }

  function applyPageBackground() {
    document.body.style.background = CONFIG.pageBackgroundColor;
  }

  function init() {
    const oldCX = CX, oldCY = CY, oldRadius = RADIUS;
    applyPageBackground();

    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    metaballCanvas.width = W;
    metaballCanvas.height = H;
    liquidCanvas.width = W;
    liquidCanvas.height = H;
    CX = W / 2;
    CY = H / 2;
    RADIUS = Math.min(W, H) / 2 * CONFIG.clockRadiusFactor;
    PHYSICS_RADIUS = RADIUS * CONFIG.physicsOvershootFactor;
    buildWalls();
    buildSecondHand();
    buildSizeSchedule();

    if (!started) {
      started = true;
      preloadElapsedSeconds();
    } else {
      rescaleCircles(oldCX, oldCY, oldRadius, CX, CY, RADIUS);
    }
  }

  window.addEventListener("resize", init);

  // ---------- live config panel ----------
  // A small runtime control panel (bottom-left) for tweaking the most
  // interesting CONFIG knobs while the clock is running. Most values are
  // read fresh every frame/spawn/reset, so they take effect instantly;
  // a few (walls, second-hand geometry, gravity, size scheduling) need an
  // explicit rebuild, handled in onConfigChange below.
  const DEFAULT_CONFIG = JSON.parse(JSON.stringify(CONFIG));

  const CONTROL_SCHEMA = [
    { section: "Physics", controls: [
      { key: "gravity", label: "Gravity", type: "range", min: 0, max: 2, step: 0.05 },
      { key: "restitution", label: "Bounciness", type: "range", min: 0, max: 1, step: 0.05 },
      { key: "friction", label: "Friction", type: "range", min: 0, max: 1, step: 0.05 },
    ]},
    { section: "Spawn", controls: [
      { key: "spawnLocation", label: "Birth location", type: "select", options: ["random", "center"] },
      { key: "burstSpeedMin", label: "Burst speed min", type: "range", min: 0, max: 20, step: 0.5 },
      { key: "burstSpeedMax", label: "Burst speed max", type: "range", min: 0, max: 20, step: 0.5 },
      { key: "spinMax", label: "Spin", type: "range", min: 0, max: 1, step: 0.02 },
    ]},
    { section: "Liquid Merge", controls: [
      { key: "liquidMergeEnabled", label: "Enabled", type: "checkbox" },
      { key: "liquidMergeBlurFactor", label: "Blur", type: "range", min: 0, max: 0.15, step: 0.005 },
      { key: "liquidMergeContrast", label: "Threshold", type: "range", min: 5, max: 60, step: 1 },
    ]},
    { section: "Circle Sizing", controls: [
      { key: "circlesPerCycle", label: "Circles / cycle", type: "range", min: 10, max: 60, step: 1 },
      { key: "minRadiusFactor", label: "Min size", type: "range", min: 0.01, max: 0.15, step: 0.005 },
      { key: "maxRadiusFactor", label: "Max size", type: "range", min: 0.05, max: 0.35, step: 0.005 },
      { key: "sizeVariation", label: "Size variation", type: "range", min: 0.5, max: 4, step: 0.1 },
      { key: "fillFactor", label: "Fill target", type: "range", min: 0.3, max: 1.2, step: 0.02 },
    ]},
    { section: "Birth / Death", controls: [
      { key: "birthAnimationEnabled", label: "Birth animation", type: "checkbox" },
      { key: "birthDurationMs", label: "Birth duration (ms)", type: "range", min: 50, max: 800, step: 10 },
      { key: "deathAnimationEnabled", label: "Death animation", type: "checkbox" },
      { key: "deathDurationMs", label: "Death duration (ms)", type: "range", min: 50, max: 800, step: 10 },
      { key: "deathStaggerMs", label: "Death stagger (ms)", type: "range", min: 0, max: 1000, step: 10 },
    ]},
    { section: "Face", controls: [
      { key: "numeralsEnabled", label: "Numerals", type: "checkbox" },
    ]},
    { section: "Second Hand", controls: [
      { key: "secondHandEnabled", label: "Enabled", type: "checkbox" },
      { key: "secondHandSweep", label: "Motion", type: "select", options: ["tick", "smooth"] },
      { key: "secondHandLengthFactor", label: "Length", type: "range", min: 0.3, max: 1, step: 0.01 },
    ]},
    { section: "Colours", controls: [
      { key: "pageBackgroundColor", label: "Page background", type: "color" },
      { key: "backgroundColor", label: "Clock face background", type: "color" },
      { key: "inkColor", label: "Ink", type: "color" },
      { key: "circleColor", label: "Circles", type: "color" },
      { key: "hourHandColor", label: "Hour hand", type: "color" },
      { key: "minuteHandColor", label: "Minute hand", type: "color" },
      { key: "secondHandColor", label: "Second hand", type: "color" },
      { key: "borderEnabled", label: "Face outline", type: "checkbox" },
      { key: "borderColor", label: "Outline colour", type: "color" },
    ]},
  ];

  const REBUILD_WALLS_KEYS = new Set(["wallSegments", "wallThickness", "wallChordOverlap"]);
  const REBUILD_HAND_KEYS = new Set(["secondHandEnabled", "secondHandLengthFactor", "secondHandTailFactor", "secondHandThicknessFactor"]);
  const REBUILD_SCHEDULE_KEYS = new Set(["circlesPerCycle", "minRadiusFactor", "maxRadiusFactor", "sizeVariation", "fillFactor"]);

  function onConfigChange(key) {
    if (key === "gravity") world.gravity.y = CONFIG.gravity;
    if (key === "pageBackgroundColor") applyPageBackground();
    if (REBUILD_WALLS_KEYS.has(key)) buildWalls();
    if (REBUILD_HAND_KEYS.has(key)) buildSecondHand();
    if (REBUILD_SCHEDULE_KEYS.has(key)) buildSizeSchedule();
  }

  function renderControls(container) {
    container.innerHTML = "";
    CONTROL_SCHEMA.forEach(section => {
      const sectionEl = document.createElement("div");
      sectionEl.className = "cfg-section";
      const h4 = document.createElement("h4");
      h4.textContent = section.section;
      sectionEl.appendChild(h4);

      section.controls.forEach(ctrl => {
        const row = document.createElement("div");
        row.className = "cfg-row";

        const label = document.createElement("label");
        label.textContent = ctrl.label;
        row.appendChild(label);

        if (ctrl.type === "range") {
          const input = document.createElement("input");
          input.type = "range";
          input.min = ctrl.min;
          input.max = ctrl.max;
          input.step = ctrl.step;
          input.value = CONFIG[ctrl.key];
          const val = document.createElement("span");
          val.className = "cfg-val";
          val.textContent = CONFIG[ctrl.key];
          input.addEventListener("input", () => {
            CONFIG[ctrl.key] = parseFloat(input.value);
            val.textContent = CONFIG[ctrl.key];
            onConfigChange(ctrl.key);
          });
          row.appendChild(input);
          row.appendChild(val);
        } else if (ctrl.type === "checkbox") {
          const input = document.createElement("input");
          input.type = "checkbox";
          input.checked = !!CONFIG[ctrl.key];
          input.addEventListener("change", () => {
            CONFIG[ctrl.key] = input.checked;
            onConfigChange(ctrl.key);
          });
          row.appendChild(input);
        } else if (ctrl.type === "select") {
          const input = document.createElement("select");
          ctrl.options.forEach(opt => {
            const o = document.createElement("option");
            o.value = opt;
            o.textContent = opt;
            if (opt === CONFIG[ctrl.key]) o.selected = true;
            input.appendChild(o);
          });
          input.addEventListener("change", () => {
            CONFIG[ctrl.key] = input.value;
            onConfigChange(ctrl.key);
          });
          row.appendChild(input);
        } else if (ctrl.type === "color") {
          const input = document.createElement("input");
          input.type = "color";
          input.value = CONFIG[ctrl.key];
          input.addEventListener("input", () => {
            CONFIG[ctrl.key] = input.value;
            onConfigChange(ctrl.key);
          });
          row.appendChild(input);
        }

        sectionEl.appendChild(row);
      });

      container.appendChild(sectionEl);
    });
  }

  function buildConfigPanel() {
    const panel = document.getElementById("configPanel");
    const toggle = document.getElementById("configToggle");
    const controlsContainer = document.getElementById("configControls");
    const resetBtn = document.getElementById("configReset");

    toggle.addEventListener("click", () => panel.classList.toggle("open"));
    renderControls(controlsContainer);

    resetBtn.addEventListener("click", () => {
      Object.assign(CONFIG, JSON.parse(JSON.stringify(DEFAULT_CONFIG)));
      world.gravity.y = CONFIG.gravity;
      applyPageBackground();
      buildWalls();
      buildSecondHand();
      buildSizeSchedule();
      renderControls(controlsContainer);
    });
  }

  init();
  buildConfigPanel();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
